<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ϟ ϟ ϟ</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            /* 背景預設全黑 */
            background-color: #000;
            /* 控制顏色淡回黑色的速度：0.4秒，使用 ease-out 讓效果更自然 */
            transition: background-color 0.1s ease-out; 
            
            font-family: sans-serif;
            touch-action: none; 
        }
        
        canvas { 
            display: block; 
            background: transparent !important;
            position: absolute; top: 0; left: 0; z-index: 1;
        }
        
        #desktop-block {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #fff; z-index: 2000;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }

        @media (min-width: 1024px) {
            #desktop-block { display: flex; }
        }

        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 18px 36px; background: #fff; border: none; border-radius: 50px;
            font-weight: bold; font-size: 1rem; color: #000;
            cursor: pointer; z-index: 100; box-shadow: 0 0 30px rgba(255,255,255,0.3);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="desktop-block">
        <h1>📱🙏</h1>
        <p>MOBILE ONLY</p>
    </div>

    <button id="start-btn">S T A R T</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint, Events } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        const startBtn = document.getElementById('start-btn');
        
        engine.gravity.y = 0;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent',
                pixelRatio: window.devicePixelRatio
            }
        });

        // --- 1. 建立邊界 ---
        const wallOptions = { isStatic: true, label: 'wall', render: { visible: false } };
        Composite.add(world, [
            Bodies.rectangle(window.innerWidth/2, window.innerHeight + 50, window.innerWidth, 100, wallOptions),
            Bodies.rectangle(window.innerWidth/2, -50, window.innerWidth, 100, wallOptions),
            Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight, wallOptions),
            Bodies.rectangle(window.innerWidth + 50, window.innerHeight/2, 100, window.innerHeight, wallOptions)
        ]);

        // --- 2. 建立 SVG 物件 (01.svg - 05.svg) ---
        const svgFiles = ['06.svg','07.svg', '01.svg', '02.svg', '03.svg', '04.svg', '05.svg'];
        svgFiles.forEach((fileName, index) => {
            const radius = 55 + Math.random() * 25;
            const body = Bodies.circle(
                Math.random() * window.innerWidth,
                Math.random() * window.innerHeight,
                radius,
                {
                    label: 'object',
                    mass: 1 + (index * 2),
                    restitution: 0.7, 
                    frictionAir: 0.02,
                    render: {
                        sprite: {
                            texture: `./${fileName}`,
                            xScale: (radius * 2) / 200,
                            yScale: (radius * 2) / 200
                        }
                    }
                }
            );
            Composite.add(world, body);
        });

        // --- 3. 核心功能：白色閃爍邏輯 ---
        function addCollisionFlasher() {
            Events.on(engine, 'collisionStart', (event) => {
                const pairs = event.pairs;
                for (let i = 0, j = pairs.length; i < j; ++i) {
                    const pair = pairs[i];

                    // 檢查是否為物件與牆壁碰撞
                    if (
                        (pair.bodyA.label === 'wall' && pair.bodyB.label === 'object') ||
                        (pair.bodyA.label === 'object' && pair.bodyB.label === 'wall')
                    ) {
                        triggerFlash();
                    }
                }
            });
        }

        function triggerFlash() {
            // 1. 移除過渡動畫，讓變白是瞬發的 (Flash)
            document.body.style.transition = 'none';
            document.body.style.backgroundColor = '#313131';
            
            // 2. 強制瀏覽器重繪 (Reflow) 以套用瞬間的白色
            document.body.offsetHeight; 
            
            // 3. 重新加上過渡動畫，並設定回黑色 (Fade out)
            document.body.style.transition = 'background-color 0.1s ease-out';
            document.body.style.backgroundColor = '#000';
        }

        // 陀螺儀與觸控
        function handleOrientation(event) {
            engine.gravity.x = event.gamma / 12;
            engine.gravity.y = event.beta / 12;
        }

        function addTouchControl() {
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: { stiffness: 0.2, render: { visible: false } }
            });
            Composite.add(world, mouseConstraint);
            render.mouse = mouse;
        }

        startBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') { initApp(); }
                    });
            } else { initApp(); }
        });

        function initApp() {
            startBtn.style.display = 'none';
            window.addEventListener('deviceorientation', handleOrientation);
            addTouchControl();
            addCollisionFlasher();
            Render.run(render);
            const runner = Runner.create();
            Runner.run(runner, engine);
        }

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
