<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ϟ ϟ ϟ</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; 
            /* --- 背景設定：重複平鋪 bg.svg --- */
            background-color: #000; /* 底色 */
            background-image: url('./bg.svg');
            background-repeat: repeat;
            background-size: 40px; /* 你可以調整這個數值來決定背景圖案的大小 */
            
            font-family: sans-serif;
            touch-action: none; 
        }
        
        /* 讓 Canvas 透明，才能看到下方的背景圖 */
        canvas { 
            display: block; 
            background: transparent !important;
        }
        
        #desktop-block {
            display: none; 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; color: #fff; z-index: 2000;
            flex-direction: column; justify-content: center; align-items: center;
            text-align: center;
        }

        @media (min-width: 1024px) {
            #desktop-block { display: flex; }
        }

        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 18px 36px; background: #fff; border: none; border-radius: 50px;
            font-weight: bold; font-size: 1rem; color: #000;
            cursor: pointer; z-index: 100; box-shadow: 0 0 20px rgba(255,255,255,0.2);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="desktop-block">
        <h1>🥲 🥲 🥲</h1>
        <p>MOBILE ONLY</p>
    </div>

    <button id="start-btn">按下允許就對ㄌ</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <script>
        const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;

        const engine = Engine.create();
        const world = engine.world;
        const startBtn = document.getElementById('start-btn');
        
        engine.gravity.y = 0;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: window.innerWidth,
                height: window.innerHeight,
                wireframes: false,
                background: 'transparent', // 關鍵：將物理渲染器設為透明
                pixelRatio: window.devicePixelRatio
            }
        });

        // 邊界設定
        const wallOptions = { isStatic: true, render: { visible: false } };
        Composite.add(world, [
            Bodies.rectangle(window.innerWidth/2, window.innerHeight + 50, window.innerWidth, 100, wallOptions),
            Bodies.rectangle(window.innerWidth/2, -50, window.innerWidth, 100, wallOptions),
            Bodies.rectangle(-50, window.innerHeight/2, 100, window.innerHeight, wallOptions),
            Bodies.rectangle(window.innerWidth + 50, window.innerHeight/2, 100, window.innerHeight, wallOptions)
        ]);

        // SVG 物件載入 (01.svg - 05.svg)
        const svgFiles = ['06.svg', '05.svg', '04.svg', '01.svg', '02.svg', '03.svg'];
        svgFiles.forEach((fileName, index) => {
            const radius = 55 + Math.random() * 25;
            const body = Bodies.circle(
                Math.random() * window.innerWidth,
                Math.random() * window.innerHeight,
                radius,
                {
                    mass: 1 + (index * 2),
                    restitution: 0.6,
                    frictionAir: 0.02,
                    render: {
                        sprite: {
                            texture: `./${fileName}`,
                            xScale: (radius * 2) / 200,
                            yScale: (radius * 2) / 200
                        }
                    }
                }
            );
            Composite.add(world, body);
        });

        // 陀螺儀控制
        function handleOrientation(event) {
            engine.gravity.x = event.gamma / 15;
            engine.gravity.y = event.beta / 15;
        }

        // 觸控控制
        function addTouchControl() {
            const mouse = Mouse.create(render.canvas);
            const mouseConstraint = MouseConstraint.create(engine, {
                mouse: mouse,
                constraint: {
                    stiffness: 0.2,
                    render: { visible: false }
                }
            });
            Composite.add(world, mouseConstraint);
            render.mouse = mouse;
        }

        startBtn.addEventListener('click', () => {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            initApp();
                        }
                    });
            } else {
                initApp();
            }
        });

        function initApp() {
            startBtn.style.display = 'none';
            window.addEventListener('deviceorientation', handleOrientation);
            addTouchControl();
            Render.run(render);
            const runner = Runner.create();
            Runner.run(runner, engine);
        }

        window.addEventListener('resize', () => {
            render.canvas.width = window.innerWidth;
            render.canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
